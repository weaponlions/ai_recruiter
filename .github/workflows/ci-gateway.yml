name: CI — api-gateway

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api-gateway/**'
      - 'packages/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/api-gateway/**'
      - 'packages/**'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=@hr-ai/api-gateway...

      - name: Type-check
        run: pnpm turbo run type-check --filter=@hr-ai/api-gateway...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm turbo run test --filter=@hr-ai/api-gateway

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: false
          tags: hr-ai/api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
