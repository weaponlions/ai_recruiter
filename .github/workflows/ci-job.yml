name: CI — job-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/job-service/**'
      - 'packages/**'
      - '.github/workflows/ci-job.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/job-service/**'
      - 'packages/**'

env:
  NODE_VERSION: '20'

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile --network-concurrency 2
      - run: yarn turbo run lint --filter=@hr-ai/job-service...
      - run: yarn turbo run type-check --filter=@hr-ai/job-service...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: job_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/job_db_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile --network-concurrency 2
      - name: Generate Prisma client
        run: yarn workspace @hr-ai/job-service exec prisma generate
      - run: yarn turbo run test --filter=@hr-ai/job-service

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/job-service/Dockerfile
          push: false
          tags: hr-ai/job-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
