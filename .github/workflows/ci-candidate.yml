name: CI — candidate-service

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/candidate-service/**'
      - 'packages/**'
      - '.github/workflows/ci-candidate.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/candidate-service/**'
      - 'packages/**'

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint --filter=@hr-ai/candidate-service...
      - run: pnpm turbo run type-check --filter=@hr-ai/candidate-service...

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: candidate_db_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/candidate_db_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter=@hr-ai/candidate-service exec prisma generate
      - run: pnpm turbo run test --filter=@hr-ai/candidate-service

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/candidate-service/Dockerfile
          push: false
          tags: hr-ai/candidate-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
